name: Validate catalog and website
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build && npm run validate
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Audit the production build
        run: npm run build && npm run validate && npm run test:performance
        env:
          PRODUCTION: 'true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-reports
          path: |
            reports/
            playwright-report/
          if-no-files-found: ignore
